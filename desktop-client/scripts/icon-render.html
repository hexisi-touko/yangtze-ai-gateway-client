<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <style>
      html, body { width: 256px; height: 256px; margin: 0; overflow: hidden; background: transparent; }
      #icon-source { display: block; width: 256px; height: 256px; object-fit: contain; }
    </style>
  </head>
  <body>
    <img id="icon-source" alt="" src="">
    <script>
      const source = new URLSearchParams(location.search).get('logo')
      document.querySelector('#icon-source').src = source || ''
    </script>
  </body>
</html>
